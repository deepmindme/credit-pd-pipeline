[project]
name = "credit-pd-pipeline"
version = "1.0.0"
description = "Автоматизированный пайплайн PD-модели для клиентов кредитных карт (UCI Taiwan)"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "notebooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src"]
